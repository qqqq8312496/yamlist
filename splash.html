<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山药List - 启动中</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .splash-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: transparent;
      cursor: pointer;
      animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-container.closing {
      animation: fadeOut 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* 背景图片层 */
    .splash-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .splash-background::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('TSY.jpg');
      background-size: cover;
      background-position: center;
      animation: zoomInLoop 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* 轻微蒙版 - 让文字更清晰但不遮盖原图颜色 */
    .splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(0, 0, 0, 0.35) 100%
      );
      border-radius: 24px;
    }

    /* 内容层 */
    .splash-content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 60px;
    }

    /* 主标题 */
    .splash-title {
      font-size: 56px;
      font-weight: 800;
      color: white;
      text-shadow:
        0 6px 20px rgba(0, 0, 0, 0.6),
        0 3px 8px rgba(0, 0, 0, 0.4),
        0 0 60px rgba(255, 255, 255, 0.2);
      margin-bottom: 24px;
      letter-spacing: 4px;
      animation: slideInDown 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
    }

    /* 分隔线 */
    .splash-divider {
      width: 120px;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.6) 20%,
        rgba(255, 255, 255, 0.8) 50%,
        rgba(255, 255, 255, 0.6) 80%,
        transparent 100%
      );
      margin-bottom: 24px;
      animation: fadeInScale 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    /* 副标题 */
    .splash-subtitle {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.5),
        0 1px 4px rgba(0, 0, 0, 0.3);
      letter-spacing: 6px;
      margin-bottom: 32px;
      animation: slideInUp 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.7s both;
    }

    /* 描述文字 */
    .splash-description {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.5),
        0 1px 3px rgba(0, 0, 0, 0.3);
      letter-spacing: 1.5px;
      line-height: 1.8;
      margin-bottom: 56px;
      animation: slideInUp 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.9s both;
    }

    /* 提示文字 */
    .splash-hint {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      letter-spacing: 1px;
      animation:
        slideInUp 0.9s cubic-bezier(0.4, 0, 0.2, 1) 1.1s both,
        blink 2.5s ease-in-out 2.5s infinite;
    }

    /* 动画定义 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.97);
      }
    }

    @keyframes zoomInLoop {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scaleX(0);
      }
      to {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.75;
      }
      50% {
        opacity: 0.35;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container" id="splashContainer">
    <div class="splash-background">
      <div class="splash-overlay"></div>
    </div>
    <div class="splash-content">
      <div class="splash-title">山药List</div>
      <div class="splash-divider"></div>
      <div class="splash-subtitle">简洁 · 优雅 · 高效</div>
      <div class="splash-description">将琐事变为秩序，让时间流向目标</div>
      <div class="splash-hint">点击任意位置继续 · Esc 或 Enter</div>
    </div>
  </div>

  <script>
    // 关闭启动窗口
    function closeSplash() {
      const container = document.getElementById('splashContainer');
      container.classList.add('closing');

      // 等待动画完成后通知主进程
      setTimeout(() => {
        window.electronAPI.send('close-splash');
      }, 600);
    }

    // 点击事件
    document.getElementById('splashContainer').addEventListener('click', closeSplash);

    // 键盘事件
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Enter') {
        closeSplash();
      }
    });
  </script>
</body>
</html>
